version: "3.9"

networks:
  dairy-net:   # defining our custom network here

services:
  db:
    image: mysql:8.0
    container_name: dairy-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: notesdb
    volumes:
      - dairy-data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d
    networks:
      - dairy-net   # attach db service to the network
    restart: always

  backend:
    build: ./backend
    container_name: dairy-backend
    environment:
      DB_HOST: db     # resolves via the "db" service name within the network
      DB_USER: root
      DB_PASS: rootpassword
      DB_NAME: notesdb
    depends_on:
      - db
    ports:
      - "3000:3000"   # optional, for debugging
    networks:
      - dairy-net     # backend is on the same network too
    restart: always

  frontend:
    image: nginx:latest
    container_name: dairy-frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html
      - ./frontend/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - dairy-net     # frontend is connected too
    restart: always

volumes:
  dairy-data:
